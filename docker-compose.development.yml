services:
  gateway:
    image: gateway:dev 
    container_name: gateway-dev
    hostname: gateway-dev
    ports:
      - "7111:7111"
    environment:
      ASPNETCORE_HTTP_PORTS: "7111"
      ASPNETCORE_ENVIRONMENT: "Development"

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: gateway
      MONGODB_INITDB_ROOT_PASSWORD: g4t3w4y
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
